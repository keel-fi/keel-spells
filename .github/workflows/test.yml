name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        env:
          MAINNET_RPC_URL: ${{secrets.MAINNET_RPC_URL}}
        run: |
          forge test -vvv
        id: test

      - name: Install surfpool
        run: curl -sL https://run.surfpool.run/ | bash

      - name: Show Surfpool version
        run: ~/.local/bin/surfpool --version

      - name: Run spell e2e tests
        run: |
          ~/.local/bin/surfpool start &
          sleep 5
          pnpm test:spells
